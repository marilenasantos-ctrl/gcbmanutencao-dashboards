<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Dashboard de Abastecimento</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
  color: #333;
}

header {
  padding: 16px 24px;
  background: #ffffff;
  border-bottom: 1px solid #ddd;
}

h1 {
  margin: 0;
  color: #0a6b4f;
}

.container {
  padding: 24px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.05);
}

.card h3 {
  margin: 0;
  font-size: 14px;
  color: #666;
}

.card p {
  margin: 8px 0 0;
  font-size: 22px;
  font-weight: bold;
  color: #0a6b4f;
}

.filters {
  background: #fff;
  padding: 16px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.05);
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.filters select, .filters button {
  padding: 6px 10px;
}

.charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.chart-box {
  background: #fff;
  padding: 16px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.05);
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,.05);
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}

th {
  background: #f0f0f0;
  text-align: left;
}
</style>
</head>

<body>

<header>
  <h1>Dashboard de Abastecimento</h1>
</header>

<div class="container">

  <div class="cards">
    <div class="card"><h3>Total de Litros</h3><p id="kpiLitros">0</p></div>
    <div class="card"><h3>Valor Total (R$)</h3><p id="kpiValor">R$ 0,00</p></div>
    <div class="card"><h3>Preço Médio / Litro</h3><p id="kpiMedia">0,00</p></div>
    <div class="card"><h3>Abastecimentos</h3><p id="kpiQtd">0</p></div>
  </div>

  <div class="filters">
    <select id="fPosto"></select>
    <select id="fCentro"></select>
    <select id="fPlaca"></select>
    <button onclick="aplicarFiltros()">Aplicar</button>
    <button onclick="resetar()">Limpar</button>
  </div>

  <div class="charts">
    <div class="chart-box"><canvas id="chartMes"></canvas></div>
    <div class="chart-box"><canvas id="chartPlaca"></canvas></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Posto</th>
        <th>Centro de Custo</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Placa</th>
        <th>Produto</th>
        <th>Litros</th>
        <th>Valor Litro</th>
        <th>Valor Total</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script>
const URL = "https://script.google.com/a/macros/gcbmanutencao.com.br/s/AKfycbzl5dUZWPAXZljKv2U93kus67Cpu1g6EhiXu9vK973-77t_phxt1rPY_nAWEkG-JPgGRw/exec";

let dados = [];
let filtrados = [];
let chartMes, chartPlaca;

fetch(URL)
  .then(r => r.json())
  .then(resp => {
    dados = resp.data || [];
    filtrados = dados;
    carregarFiltros();
    render();
  })
  .catch(e => alert("Erro ao carregar dados"));

function carregarFiltros() {
  preencherSelect("fPosto", "Nome do Posto");
  preencherSelect("fCentro", "Centro de Custo");
  preencherSelect("fPlaca", "Placa");
}

function preencherSelect(id, campo) {
  const sel = document.getElementById(id);
  sel.innerHTML = "<option value=''>Todos</option>";
  [...new Set(dados.map(d => d[campo]).filter(Boolean))].forEach(v => {
    sel.innerHTML += `<option>${v}</option>`;
  });
}

function aplicarFiltros() {
  const p = fPosto.value;
  const c = fCentro.value;
  const l = fPlaca.value;

  filtrados = dados.filter(d =>
    (!p || d["Nome do Posto"] === p) &&
    (!c || d["Centro de Custo"] === c) &&
    (!l || d["Placa"] === l)
  );
  render();
}

function resetar() {
  filtrados = dados;
  render();
}

function render() {
  atualizarKPIs();
  tabela();
  graficos();
}

function atualizarKPIs() {
  const litros = filtrados.reduce((s,d)=>s+Number(d.Litros||0),0);
  const valor = filtrados.reduce((s,d)=>s+Number(d["Valor Total"]||0),0);

  kpiLitros.innerText = litros.toLocaleString("pt-BR",{minimumFractionDigits:2});
  kpiValor.innerText = valor.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  kpiMedia.innerText = litros ? (valor/litros).toFixed(2) : "0,00";
  kpiQtd.innerText = filtrados.length;
}

function tabela() {
  tbody.innerHTML = "";
  filtrados.forEach(d=>{
    tbody.innerHTML += `
      <tr>
        <td>${d["Nome do Posto"]||""}</td>
        <td>${d["Centro de Custo"]||""}</td>
        <td>${d["Data de Abastecimento"]||""}</td>
        <td>${d["Hora"]||""}</td>
        <td>${d["Placa"]||""}</td>
        <td>${d["Produto"]||""}</td>
        <td>${Number(d.Litros||0).toLocaleString("pt-BR")}</td>
        <td>${Number(d["Valor Litro"]||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
        <td>${Number(d["Valor Total"]||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
      </tr>`;
  });
}

function graficos() {
  if(chartMes) chartMes.destroy();
  if(chartPlaca) chartPlaca.destroy();

  const porMes = {};
  filtrados.forEach(d=>{
    const mes = d["Data de Abastecimento"]?.substring(3,10);
    porMes[mes] = (porMes[mes]||0) + Number(d["Valor Total"]||0);
  });

  chartMes = new Chart(chartMesCtx(), {
    type: "bar",
    data: { labels:Object.keys(porMes), datasets:[{label:"Valor (R$)",data:Object.values(porMes),backgroundColor:"#9ad0f5"}]}
  });

  const porPlaca = {};
  filtrados.forEach(d=>{
    porPlaca[d.Placa] = (porPlaca[d.Placa]||0) + Number(d.Litros||0);
  });

  const top = Object.entries(porPlaca).sort((a,b)=>b[1]-a[1]).slice(0,10);

  chartPlaca = new Chart(chartPlacaCtx(), {
    type:"bar",
    data:{labels:top.map(i=>i[0]),datasets:[{label:"Litros",data:top.map(i=>i[1]),backgroundColor:"#9ad0f5"}]}
  });
}

function chartMesCtx(){return document.getElementById("chartMes").getContext("2d")}
function chartPlacaCtx(){return document.getElementById("chartPlaca").getContext("2d")}
</script>

</body>
</html>
