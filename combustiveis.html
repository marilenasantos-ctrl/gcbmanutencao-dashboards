<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Dashboard de Abastecimento</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  padding: 16px 24px;
  font-size: 22px;
  font-weight: bold;
  color: #0a7a4b;
  background: #ffffff;
  border-bottom: 1px solid #ddd;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  padding: 20px;
}

.card {
  background: #ffffff;
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

.card span {
  font-size: 13px;
  color: #666;
}

.card strong {
  display: block;
  margin-top: 6px;
  font-size: 22px;
  color: #0a7a4b;
}

.section {
  padding: 0 20px 20px;
}

.box {
  background: #ffffff;
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 13px;
}

th {
  background: #0a7a4b;
  color: #fff;
  padding: 8px;
  text-align: left;
}

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
}

canvas {
  max-height: 280px;
}
</style>
</head>

<body>

<header>Dashboard de Abastecimento</header>

<div class="cards">
  <div class="card"><span>Total de Litros</span><strong id="totalLitros">0</strong></div>
  <div class="card"><span>Valor Total (R$)</span><strong id="valorTotal">R$ 0,00</strong></div>
  <div class="card"><span>Preço Médio / Litro</span><strong id="precoMedio">0,00</strong></div>
  <div class="card"><span>Abastecimentos</span><strong id="qtd">0</strong></div>
</div>

<div class="section">
  <div class="box">
    <canvas id="graficoPlacas"></canvas>
  </div>
</div>

<div class="section">
  <div class="box">
    <table>
      <thead>
        <tr>
          <th>Posto</th>
          <th>Centro de Custo</th>
          <th>Data</th>
          <th>Hora</th>
          <th>Placa</th>
          <th>Produto</th>
          <th>Litros</th>
          <th>Valor Litro</th>
          <th>Valor Total</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbyrQ7euLEQOBgsSEBAyhhu-ilT808coUjS-zDKoh8S4xZQvryiLfyexh-EAd3icqwswuw/exec";

fetch(URL)
  .then(r => r.json())
  .then(dados => iniciar(dados))
  .catch(() => alert("Erro ao carregar dados"));

function iniciar(dados) {
  let totalLitros = 0;
  let totalValor = 0;
  const placas = {};
  const tbody = document.getElementById("tabela");

  dados.forEach(l => {
    const litros = Number(l.Litros) || 0;
    const valor = Number(l["Valor Total"]) || 0;

    totalLitros += litros;
    totalValor += valor;

    placas[l.Placa] = (placas[l.Placa] || 0) + litros;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${l.Posto}</td>
      <td>${l["Centro de Custo"]}</td>
      <td>${formatarData(l["Data de Abastecimento"])}</td>
      <td>${formatarHora(l["Hora Abastecimento"])}</td>
      <td>${l.Placa}</td>
      <td>${l.Produto}</td>
      <td>${litros.toLocaleString("pt-BR")}</td>
      <td>${Number(l["Valor Litro"]).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
      <td>R$ ${valor.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("totalLitros").innerText =
    totalLitros.toLocaleString("pt-BR");

  document.getElementById("valorTotal").innerText =
    "R$ " + totalValor.toLocaleString("pt-BR",{minimumFractionDigits:2});

  document.getElementById("precoMedio").innerText =
    (totalValor / totalLitros).toLocaleString("pt-BR",{minimumFractionDigits:2});

  document.getElementById("qtd").innerText = dados.length;

  montarGrafico(placas);
}

function montarGrafico(placas) {
  const labels = Object.keys(placas);
  const valores = Object.values(placas);

  new Chart(document.getElementById("graficoPlacas"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Litros",
        data: valores,
        backgroundColor: "#0a7a4b"
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } }
    }
  });
}

function formatarData(v) {
  if (!v) return "";
  const d = new Date(v);
  return d.toLocaleDateString("pt-BR");
}

function formatarHora(v) {
  if (!v) return "";
  const d = new Date(v);
  return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
</script>

</body>
</html>
