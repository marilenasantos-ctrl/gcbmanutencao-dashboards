<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard de Abastecimento</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* === CSS ORIGINAL (INALTERADO) === */
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#f3f4f6;color:#111827}
header{background:#f9fafb;border-bottom:1px solid #e5e7eb;padding:16px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:20px;color:#065f46}
header p{margin:0;font-size:13px;color:#6b7280}
.upload-area{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:10px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.status-pill{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:10px 14px;border-radius:999px;font-size:12px}
main{padding:20px 24px 40px;max-width:1400px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
.card{background:#fff;border-radius:16px;padding:16px;border:1px solid #e5e7eb}
.card-title{font-size:11px;color:#6b7280;text-transform:uppercase}
.card-value{font-size:22px;font-weight:bold;color:#065f46}
.filters{background:#fff;border-radius:16px;padding:16px;border:1px solid #e5e7eb;margin-top:20px}
.filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
select,input{width:100%;padding:7px 10px;border-radius:999px;border:1px solid #d1d5db;font-size:12px}
.btn{border-radius:999px;border:none;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:bold}
.btn-primary{background:#22c55e;color:#fff}
.btn-secondary{background:#e5e7eb}
.btn-danger{background:#fee2e2;color:#991b1b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
canvas{max-height:340px}
.table-container{margin-top:20px;background:#fff;border-radius:16px;border:1px solid #e5e7eb;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
thead{background:#f9fafb}
</style>
</head>

<body>

<header>
  <div>
    <h1>Dashboard de Abastecimento</h1>
    <p>Relatório Geral</p>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <label class="upload-area" for="fileInput">📂 Importar atualização</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <div class="status-pill" id="status">Base carregada</div>
  </div>
</header>

<main>

<div class="cards">
  <div class="card"><div class="card-title">Total Litros</div><div class="card-value" id="cLitros">-</div></div>
  <div class="card"><div class="card-title">Valor Total</div><div class="card-value" id="cValor">-</div></div>
  <div class="card"><div class="card-title">Preço Médio</div><div class="card-value" id="cMedia">-</div></div>
  <div class="card"><div class="card-title">Abastecimentos</div><div class="card-value" id="cQtd">-</div></div>
</div>

<div class="grid">
  <canvas id="chartMensal"></canvas>
  <canvas id="chartPlacas"></canvas>
</div>

<div class="grid">
  <canvas id="chartPostos"></canvas>
  <canvas id="chartCentros"></canvas>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>Posto</th><th>Centro</th><th>Data</th><th>Hora</th><th>Placa</th>
<th>Produto</th><th>Litros</th><th>Valor Litro</th><th>Valor Total</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</main>

</html>
