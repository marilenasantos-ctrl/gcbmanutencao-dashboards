<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard de Abastecimento</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

header {
  background: #ffffff;
  padding: 16px 24px;
  border-bottom: 1px solid #ddd;
}

h1 {
  margin: 0;
  color: #0b7d55;
}

.container {
  padding: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.card h3 {
  margin: 0;
  font-size: 13px;
  color: #666;
}

.card p {
  margin: 6px 0 0;
  font-size: 22px;
  font-weight: bold;
  color: #0b7d55;
}

.charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.chart-box {
  background: #fff;
  padding: 16px;
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  font-size: 13px;
}

th {
  background: #f0f0f0;
}
</style>
</head>

<body>

<header>
  <h1>Dashboard de Abastecimento</h1>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Total de Litros</h3>
      <p id="totalLitros">0</p>
    </div>
    <div class="card">
      <h3>Valor Total (R$)</h3>
      <p id="valorTotal">R$ 0,00</p>
    </div>
    <div class="card">
      <h3>Preço Médio / Litro</h3>
      <p id="precoMedio">0,00</p>
    </div>
    <div class="card">
      <h3>Abastecimentos</h3>
      <p id="qtd">0</p>
    </div>
  </div>

  <div class="charts">
    <div class="chart-box">
      <canvas id="chartPlacas"></canvas>
    </div>
    <div class="chart-box">
      <canvas id="chartPostos"></canvas>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Posto</th>
        <th>Centro de Custo</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Placa</th>
        <th>Produto</th>
        <th>Litros</th>
        <th>Valor Litro</th>
        <th>Valor Total</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

</div>

<script>
const API_URL =
"https://script.google.com/a/macros/gcbmanutencao.com.br/s/AKfycbzl5dUZWPAXZljKv2U93kus67Cpu1g6EhiXu9vK973-77t_phxt1rPY_nAWEkG-JPgGRw/exec";

let dados = [];
let chartPlacas, chartPostos;

fetch(API_URL)
  .then(res => res.json())
  .then(json => {
    dados = json.data || [];
    calcular();
    montarTabela();
    montarGraficos();
  })
  .catch(err => {
    alert("Erro ao carregar dados");
    console.error(err);
  });

function calcular() {
  let litros = 0;
  let valor = 0;

  dados.forEach(d => {
    litros += Number(d["Litros"] || 0);
    valor += Number(d["Valor Total"] || 0);
  });

  document.getElementById("totalLitros").innerText =
    litros.toLocaleString("pt-BR");

  document.getElementById("valorTotal").innerText =
    valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  document.getElementById("precoMedio").innerText =
    litros ? (valor / litros).toFixed(2) : "0,00";

  document.getElementById("qtd").innerText = dados.length;
}

function montarTabela() {
  const tbody = document.getElementById("tabela");
  tbody.innerHTML = "";

  dados.forEach(d => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${d["Nome do Posto"] || ""}</td>
      <td>${d["Centro de Custo"] || ""}</td>
      <td>${d["Data de Abastecimento"] || ""}</td>
      <td>${d["Hora Abastecimento"] || ""}</td>
      <td>${d["Placa"] || ""}</td>
      <td>${d["Produto"] || ""}</td>
      <td>${Number(d["Litros"] || 0).toLocaleString("pt-BR")}</td>
      <td>${Number(d["Valor Litro"] || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
      <td>${Number(d["Valor Total"] || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
    `;
    tbody.appendChild(tr);
  });
}

function montarGraficos() {
  const porPlaca = {};
  const porPosto = {};

  dados.forEach(d => {
    porPlaca[d.Placa] = (porPlaca[d.Placa] || 0) + Number(d.Litros || 0);
    porPosto[d["Nome do Posto"]] =
      (porPosto[d["Nome do Posto"]] || 0) + Number(d["Valor Total"] || 0);
  });

  if (chartPlacas) chartPlacas.destroy();
  if (chartPostos) chartPostos.destroy();

  chartPlacas = new Chart(document.getElementById("chartPlacas"), {
    type: "bar",
    data: {
      labels: Object.keys(porPlaca),
      datasets: [{
        label: "Litros",
        data: Object.values(porPlaca),
        backgroundColor: "#90caf9"
      }]
    }
  });

  chartPostos = new Chart(document.getElementById("chartPostos"), {
    type: "bar",
    data: {
      labels: Object.keys(porPosto),
      datasets: [{
        label: "Valor Total (R$)",
        data: Object.values(porPosto),
        backgroundColor: "#66bb6a"
      }]
    }
  });
}
</script>

</body>
</html>
