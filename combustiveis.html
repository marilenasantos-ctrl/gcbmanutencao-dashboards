<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Abastecimento</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #0a7d4f;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
    }

    .card h3 {
      margin: 0;
      font-size: 13px;
      color: #555;
    }

    .card span {
      font-size: 22px;
      font-weight: bold;
      color: #0a7d4f;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-top: 20px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 8px;
      font-size: 13px;
      text-align: left;
    }

    th {
      background: #0a7d4f;
      color: #fff;
      position: sticky;
      top: 0;
    }

    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    canvas {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
    }
  </style>
</head>
<body>

<h1>Dashboard de Abastecimento</h1>

<div class="cards">
  <div class="card">
    <h3>Total de Litros</h3>
    <span id="totalLitros">0</span>
  </div>
  <div class="card">
    <h3>Valor Total (R$)</h3>
    <span id="valorTotal">R$ 0,00</span>
  </div>
  <div class="card">
    <h3>Preço Médio / Litro</h3>
    <span id="precoMedio">0,00</span>
  </div>
  <div class="card">
    <h3>Abastecimentos</h3>
    <span id="qtd">0</span>
  </div>
</div>

<div class="charts">
  <canvas id="chartPlacas"></canvas>
  <canvas id="chartPostos"></canvas>
</div>

<table>
  <thead>
    <tr>
      <th>Posto</th>
      <th>Centro de Custo</th>
      <th>Data</th>
      <th>Hora</th>
      <th>Placa</th>
      <th>Produto</th>
      <th>Litros</th>
      <th>Valor Litro</th>
      <th>Valor Total</th>
    </tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyrQ7euLEQOBgsSEBAyhhu-ilT808coUjS-zDKoh8S4xZQvryiLfyexh-EAd3icqwswuw/exec";

let dados = [];

fetch(API_URL)
  .then(res => res.json())
  .then(json => {
    dados = json.data;
    montarDashboard();
  })
  .catch(err => {
    alert("Erro ao carregar dados");
    console.error(err);
  });

function montarDashboard() {
  let totalLitros = 0;
  let totalValor = 0;

  const placas = {};
  const postos = {};

  const tbody = document.getElementById("tabela");
  tbody.innerHTML = "";

  dados.forEach(l => {
    const litros = Number(l["Litros"]) || 0;
    const valor = Number(l["Valor Total"]) || 0;

    totalLitros += litros;
    totalValor += valor;

    placas[l["Placa"]] = (placas[l["Placa"]] || 0) + litros;
    postos[l["Nome do Posto"]] = (postos[l["Nome do Posto"]] || 0) + valor;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${l["Nome do Posto"] || ""}</td>
      <td>${l["Centro de Custo"] || ""}</td>
      <td>${l["Data de Abastecimento"] || ""}</td>
      <td>${l["Hora Abastecimento"] || ""}</td>
      <td>${l["Placa"] || ""}</td>
      <td>${l["Produto"] || ""}</td>
      <td>${litros.toLocaleString("pt-BR")}</td>
      <td>${Number(l["Valor Litro"]).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
      <td>${valor.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("totalLitros").innerText =
    totalLitros.toLocaleString("pt-BR");

  document.getElementById("valorTotal").innerText =
    totalValor.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

  document.getElementById("precoMedio").innerText =
    (totalValor / totalLitros).toFixed(2).replace(".",",");

  document.getElementById("qtd").innerText = dados.length;

  gerarGraficos(placas, postos);
}

function gerarGraficos(placas, postos) {
  new Chart(document.getElementById("chartPlacas"), {
    type: "bar",
    data: {
      labels: Object.keys(placas),
      datasets: [{
        label: "Litros",
        data: Object.values(placas),
        backgroundColor: "#4fc3a1"
      }]
    }
  });

  new Chart(document.getElementById("chartPostos"), {
    type: "bar",
    data: {
      labels: Object.keys(postos),
      datasets: [{
        label: "Valor Total (R$)",
        data: Object.values(postos),
        backgroundColor: "#0a7d4f"
      }]
    }
  });
}
</script>

</body>
</html>
