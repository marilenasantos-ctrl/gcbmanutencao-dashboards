<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Abastecimento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111}
    header{background:#f9fafb;border-bottom:1px solid #e5e7eb;padding:16px 24px}
    header h1{margin:0;color:#065f46}
    main{padding:24px;max-width:1400px;margin:auto}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{background:#fff;border-radius:16px;padding:16px;border:1px solid #e5e7eb}
    .card-title{font-size:12px;color:#6b7280;text-transform:uppercase}
    .card-value{font-size:22px;font-weight:bold;color:#065f46}
    .filters{margin:20px 0;background:#fff;padding:16px;border-radius:16px;border:1px solid #e5e7eb}
    select,input,button{padding:6px 10px;border-radius:999px;border:1px solid #ccc;font-size:12px}
    button{cursor:pointer}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
    canvas{background:#fff;border-radius:16px;padding:10px;border:1px solid #e5e7eb}
    table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12px}
    th,td{padding:6px;border-bottom:1px solid #eee;text-align:left}
    th{background:#f9fafb}
  </style>
</head>

<body>
<header>
  <h1>Dashboard de Abastecimento</h1>
</header>

<main>

  <div class="cards">
    <div class="card">
      <div class="card-title">Total de Litros</div>
      <div class="card-value" id="kpiLitros">-</div>
    </div>
    <div class="card">
      <div class="card-title">Valor Total</div>
      <div class="card-value" id="kpiValor">-</div>
    </div>
    <div class="card">
      <div class="card-title">Preço Médio / Litro</div>
      <div class="card-value" id="kpiPreco">-</div>
    </div>
    <div class="card">
      <div class="card-title">Abastecimentos</div>
      <div class="card-value" id="kpiQtd">-</div>
    </div>
  </div>

  <div class="filters">
    <select id="fPosto"><option value="">Todos os Postos</option></select>
    <select id="fCentro"><option value="">Todos os Centros</option></select>
    <select id="fPlaca"><option value="">Todas as Placas</option></select>
    <button onclick="aplicarFiltros()">Aplicar</button>
    <button onclick="limparFiltros()">Limpar</button>
  </div>

  <div class="grid">
    <canvas id="chartMensal"></canvas>
    <canvas id="chartPostos"></canvas>
  </div>

  <table>
    <thead>
      <tr>
        <th>Posto</th>
        <th>Centro de Custo</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Placa</th>
        <th>Produto</th>
        <th>Litros</th>
        <th>Valor Litro</th>
        <th>Valor Total</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

</main>

<script>
const APPS_URL = "https://script.google.com/a/macros/gcbmanutencao.com.br/s/AKfycbzl5dUZWPAXZljKv2U93kus67Cpu1g6EhiXu9vK973-77t_phxt1rPY_nAWEkG-JPgGRw/exec";
const ABA = "Relatório Geral";

let dados = [];
let filtrados = [];

function carregarDados(){
  const cb = "cb_" + Date.now();
  window[cb] = (resp)=>{
    dados = resp.rows || [];
    filtrados = dados;
    preencherFiltros();
    render();
  };
  const s = document.createElement("script");
  s.src = `${APPS_URL}?sheet=${encodeURIComponent(ABA)}&callback=${cb}`;
  document.body.appendChild(s);
}

function preencherFiltros(){
  preencherSelect("fPosto","Nome do Posto");
  preencherSelect("fCentro","Centro de Custo");
  preencherSelect("fPlaca","Placa");
}

function preencherSelect(id,campo){
  const sel=document.getElementById(id);
  const vals=[...new Set(dados.map(d=>d[campo]).filter(Boolean))];
  vals.forEach(v=>{
    const o=document.createElement("option");
    o.value=v;o.text=v;sel.appendChild(o);
  });
}

function aplicarFiltros(){
  filtrados = dados.filter(d=>
    (!fPosto.value||d["Nome do Posto"]===fPosto.value) &&
    (!fCentro.value||d["Centro de Custo"]===fCentro.value) &&
    (!fPlaca.value||d["Placa"]===fPlaca.value)
  );
  render();
}

function limparFiltros(){
  fPosto.value="";fCentro.value="";fPlaca.value="";
  filtrados=dados;render();
}

function render(){
  const litros = filtrados.reduce((s,d)=>s+d["Litros"],0);
  const valor  = filtrados.reduce((s,d)=>s+d["Valor Total"],0);

  kpiLitros.innerText = litros.toLocaleString("pt-BR");
  kpiValor.innerText  = valor.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  kpiPreco.innerText  = (valor/litros).toLocaleString("pt-BR",{minimumFractionDigits:2});
  kpiQtd.innerText    = filtrados.length;

  tabela.innerHTML="";
  filtrados.forEach(d=>{
    tabela.innerHTML+=`
      <tr>
        <td>${d["Nome do Posto"]}</td>
        <td>${d["Centro de Custo"]}</td>
        <td>${d["Data de Abastecimento"]}</td>
        <td>${d["Hora Abastecimento"]}</td>
        <td>${d["Placa"]}</td>
        <td>${d["Produto"]}</td>
        <td>${d["Litros"].toLocaleString("pt-BR")}</td>
        <td>${d["Valor Litro"].toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
        <td>${d["Valor Total"].toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
      </tr>`;
  });
}

carregarDados();
</script>
</body>
</html>
