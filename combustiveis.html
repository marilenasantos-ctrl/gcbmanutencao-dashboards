<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard de Combustíveis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0f172a; color: #e5e7eb; }
    header { background: #020617; padding: 16px 20px; border-bottom: 1px solid #1f2933; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 20px; color: #22c55e; }
    .status-pill { background: #022c22; color: #22c55e; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    main { padding: 20px; max-width: 1300px; margin: auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { background: #020617; border: 1px solid #1f2933; border-radius: 10px; padding: 14px; }
    .card h3 { margin: 0; font-size: 13px; color: #9ca3af; }
    .card p { margin: 6px 0 0; font-size: 22px; font-weight: bold; color: #22c55e; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; margin-top: 20px; }
    canvas { background: #020617; border-radius: 10px; padding: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 30px; font-size: 13px; }
    table thead { background: #020617; }
    table th, table td { padding: 8px; border: 1px solid #1f2933; text-align: left; }
    table th { color: #22c55e; }
  </style>
</head>

<body>

<header>
  <h1>Dashboard de Combustíveis</h1>
  <div class="status-pill" id="storeStatus">Carregando Google Sheets…</div>
</header>

<main>
  <div class="cards">
    <div class="card"><h3>Total de Abastecimentos</h3><p id="kpiQtd">0</p></div>
    <div class="card"><h3>Total de Litros</h3><p id="kpiLitros">0</p></div>
    <div class="card"><h3>Valor Total (R$)</h3><p id="kpiValor">R$ 0,00</p></div>
  </div>

  <div class="charts">
    <canvas id="chartPlacas"></canvas>
    <canvas id="chartPostos"></canvas>
  </div>

  <table id="tabela">
    <thead>
      <tr>
        <th>Posto</th>
        <th>Centro de Custo</th>
        <th>Data</th>
        <th>Placa</th>
        <th>Produto</th>
        <th>Litros</th>
        <th>Valor Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<script>
  // ✅ Seu CSV publicado
  const CSV_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMD94AUg86SAgSxK3sh7SrAa7VW9I8nm9mFdhWJQP2UXdLG_deHKmetbyzQiBrgw/pub?gid=1602496860&single=true&output=csv";

  // --- CSV robusto (respeita aspas e vírgulas dentro de campos) ---
  function splitCsvLine(line) {
    const out = [];
    let cur = "";
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const ch = line[i];

      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (ch === "," && !inQuotes) {
        out.push(cur);
        cur = "";
      } else {
        cur += ch;
      }
    }
    out.push(cur);
    return out;
  }

  function unquote(s) {
    const t = String(s ?? "").trim();
    if (t.startsWith('"') && t.endsWith('"')) return t.slice(1, -1).replace(/""/g, '"').trim();
    return t;
  }

  function csvToObjects(csvText) {
    const lines = csvText.replace(/\r/g, "").split("\n").filter(l => l.trim().length > 0);
    if (!lines.length) return [];

    // remove BOM do primeiro header se existir
    const rawHeaders = splitCsvLine(lines[0]).map(h => unquote(h).replace(/^\uFEFF/, "").trim());

    return lines.slice(1).map(line => {
      const cols = splitCsvLine(line).map(unquote);
      const obj = {};
      rawHeaders.forEach((h, i) => obj[h] = (cols[i] ?? "").trim());
      return obj;
    });
  }

  function parseNumberBR(v) {
    const s = unquote(v).trim();
    if (!s) return 0;
    // aceita "2.605,50" ou "2605.50" ou "2605,50"
    const cleaned = s.replace(/\./g, "").replace(",", ".");
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : 0;
  }

  function currencyBRL(n) {
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  async function carregarDados() {
    const url = CSV_URL + "&_ts=" + Date.now(); // evita cache
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("Falha ao buscar Google Sheets (CSV).");
    const csv = await res.text();
    return csvToObjects(csv);
  }

  let chartPlacas, chartPostos;

  async function init() {
    const status = document.getElementById("storeStatus");
    status.textContent = "Carregando Google Sheets…";

    try {
      const dadosRaw = await carregarDados();

      // ✅ mapeia usando os nomes EXATOS das suas colunas
      const dados = dadosRaw.map(d => ({
        posto: d["Nome do Posto"] || "",
        centro: d["Centro de Custo"] || "",
        data: d["Data de Abastecimento"] || "",
        placa: d["Placa"] || "",
        produto: d["Produto"] || "",
        litros: parseNumberBR(d["Litros"]),
        valorTotal: parseNumberBR(d["Valor Total"]),
      }));

      const qtd = dados.length;
      const totalLitros = dados.reduce((s, r) => s + r.litros, 0);
      const totalValor = dados.reduce((s, r) => s + r.valorTotal, 0);

      document.getElementById("kpiQtd").textContent = qtd.toLocaleString("pt-BR");
      document.getElementById("kpiLitros").textContent = totalLitros.toLocaleString("pt-BR", { maximumFractionDigits: 2 });
      document.getElementById("kpiValor").textContent = currencyBRL(totalValor);

      status.textContent = `✅ Carregado: ${qtd} linhas`;

      // Tabela
      const tbody = document.querySelector("#tabela tbody");
      tbody.innerHTML = "";
      for (const r of dados) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.posto}</td>
          <td>${r.centro}</td>
          <td>${r.data}</td>
          <td>${r.placa}</td>
          <td>${r.produto}</td>
          <td>${r.litros.toLocaleString("pt-BR", { maximumFractionDigits: 3 })}</td>
          <td>${currencyBRL(r.valorTotal)}</td>
        `;
        tbody.appendChild(tr);
      }

      // Top 10 Placas por Litros
      const somaPlaca = new Map();
      for (const r of dados) {
        const key = (r.placa || "SEM PLACA").trim();
        somaPlaca.set(key, (somaPlaca.get(key) || 0) + r.litros);
      }
      const topPlacas = Array.from(somaPlaca.entries())
        .sort((a,b) => b[1] - a[1])
        .slice(0, 10);

      const labelsPlacas = topPlacas.map(x => x[0]);
      const valsPlacas = topPlacas.map(x => x[1]);

      if (chartPlacas) chartPlacas.destroy();
      chartPlacas = new Chart(document.getElementById("chartPlacas"), {
        type: "bar",
        data: {
          labels: labelsPlacas,
          datasets: [{ label: "Top 10 Placas por Litros", data: valsPlacas, backgroundColor: "#22c55e" }]
        },
        options: {
          responsive: true,
          plugins: {
            tooltip: { callbacks: { label: (ctx) => ctx.parsed.y.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " L" } }
          }
        }
      });

      // Top 10 Postos por Valor Total
      const somaPosto = new Map();
      for (const r of dados) {
        const key = (r.posto || "SEM POSTO").trim();
        somaPosto.set(key, (somaPosto.get(key) || 0) + r.valorTotal);
      }
      const topPostos = Array.from(somaPosto.entries())
        .sort((a,b) => b[1] - a[1])
        .slice(0, 10);

      const labelsPostos = topPostos.map(x => x[0]);
      const valsPostos = topPostos.map(x => x[1]);

      if (chartPostos) chartPostos.destroy();
      chartPostos = new Chart(document.getElementById("chartPostos"), {
        type: "bar",
        data: {
          labels: labelsPostos,
          datasets: [{ label: "Top 10 Postos por Valor Total", data: valsPostos, backgroundColor: "#16a34a" }]
        },
        options: {
          responsive: true,
          plugins: {
            tooltip: { callbacks: { label: (ctx) => currencyBRL(ctx.parsed.y) } }
          },
          scales: {
            y: { ticks: { callback: (v) => v.toLocaleString("pt-BR", { notation: "compact", compactDisplay: "short" }) } }
          }
        }
      });

    } catch (err) {
      console.error(err);
      status.textContent = "❌ Erro ao carregar o Google Sheets (veja o console)";
    }
  }

  init();
</script>

</body>
</html>
