<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard de Abastecimento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #111827; }

    header {
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 { margin: 0; font-size: 20px; color: #065f46; }
    header p { margin: 0; font-size: 13px; color: #6b7280; }

    .upload-area {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 12px;
    }

    main {
      padding: 20px 24px 40px;
      max-width: 1400px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 10px rgba(0,0,0,.05);
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7280;
    }

    .card-value {
      font-size: 22px;
      font-weight: bold;
      color: #065f46;
    }

    .filters-panel {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      margin-top: 20px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    select, input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      font-size: 12px;
    }

    .btn {
      border-radius: 999px;
      border: none;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary { background: #22c55e; color: #fff; }
    .btn-secondary { background: #e5e7eb; }
    .btn-danger { background: #fee2e2; color: #991b1b; }

    .grid-layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    canvas { max-height: 340px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 16px;
      background: #fff;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }

    thead { background: #f9fafb; }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Dashboard de Abastecimento</h1>
    <p>Dados carregados somente via planilha Excel</p>
  </div>

  <div style="display:flex; gap:10px;">
    <label class="upload-area" for="fileInput">
      📂 Importar planilha (.xlsx)
    </label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
    <div class="status-pill" id="status">Nenhum arquivo carregado</div>
  </div>
</header>

<main>

  <div class="cards">
    <div class="card">
      <div class="card-title">Total Litros</div>
      <div class="card-value" id="totalLitros">-</div>
    </div>
    <div class="card">
      <div class="card-title">Valor Total (R$)</div>
      <div class="card-value" id="valorTotal">-</div>
    </div>
    <div class="card">
      <div class="card-title">Preço Médio</div>
      <div class="card-value" id="precoMedio">-</div>
    </div>
    <div class="card">
      <div class="card-title">Qtd. Abastecimentos</div>
      <div class="card-value" id="qtd">-</div>
    </div>
  </div>

  <div class="grid-layout">
    <canvas id="chartMensal"></canvas>
    <canvas id="chartPlacas"></canvas>
  </div>

  <table>
    <thead>
      <tr>
        <th>Posto</th>
        <th>Centro de Custo</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Placa</th>
        <th>Produto</th>
        <th>Litros</th>
        <th>Valor Litro</th>
        <th>Valor Total</th>
      </tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>

</main>

<script>
let DATA = [];

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = evt => {
    const workbook = XLSX.read(evt.target.result, { type: "binary" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    DATA = XLSX.utils.sheet_to_json(sheet, { defval: "" });

    document.getElementById("status").innerText = "Arquivo carregado com sucesso";
    renderDashboard();
  };
  reader.readAsBinaryString(file);
});

function renderDashboard() {
  let totalLitros = 0;
  let totalValor = 0;

  DATA.forEach(r => {
    totalLitros += Number(r["Litros"]) || 0;
    totalValor += Number(r["Valor Total"]) || 0;
  });

  document.getElementById("totalLitros").innerText = totalLitros.toFixed(2);
  document.getElementById("valorTotal").innerText = totalValor.toFixed(2);
  document.getElementById("precoMedio").innerText =
    totalLitros ? (totalValor / totalLitros).toFixed(2) : "-";
  document.getElementById("qtd").innerText = DATA.length;

  const tbody = document.getElementById("dataBody");
  tbody.innerHTML = "";

  DATA.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r["Nome do Posto"]}</td>
      <td>${r["Centro de Custo"]}</td>
      <td>${r["Data de Abastecimento"]}</td>
      <td>${r["Hora Abastecimento"]}</td>
      <td>${r["Placa"]}</td>
      <td>${r["Produto"]}</td>
      <td>${r["Litros"]}</td>
      <td>${r["Valor Litro"]}</td>
      <td>${r["Valor Total"]}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
